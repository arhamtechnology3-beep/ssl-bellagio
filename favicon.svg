<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E096" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0815" />
      <stop offset="100%" stop-color="#2A0209" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.45" />
  <!-- Brand Text: SSL -->
  <text x="256" y="125" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="62" font-weight="bold" fill="url(#goldGrad)" letter-spacing="6">SSL</text>
  <!-- Accent Line -->
  <line x1="196" y1="148" x2="316" y2="148" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Brand Monogram: B -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="240" font-weight="bold" fill="url(#goldGrad)">B</text>
  <!-- Bottom Diamond Flourish -->
  <polygon points="256,432 272,444 256,456 240,444" fill="#F5E096" />
  <line x1="180" y1="444" x2="225" y2="444" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="287" y1="444" x2="332" y2="444" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
